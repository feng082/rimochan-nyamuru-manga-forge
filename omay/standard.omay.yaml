# Open Manga Artwork YAML（OMAY）v10.2 —— 图像生成指令文件
# 别名：Nyamuru🐱
#
# 用于将 OMNY（Open Manga Name YAML）格式的漫画分镜绘制为漫画的
# 作画、演出规则（style_notes）和版式规范（layout_spec）。
#
# 用法：
# - 将本文件作为 Codex 图像生成任务的作画与版式规则一次性提供
# - 此后每部作品只需提供 OMNY 文件
# - 规则更新时，只需更新本文件并替换项目指令，即可应用到所有作品
#
# spec_version 应与对应 OMNY 的 schema_version 保持一致

spec_name: "Open Manga Artwork YAML"
spec_version: 10.2

# 作画与演出规则（对所有格子通用）
style_notes:
  - "台词、气泡、独白、作品标题和页码必须由图像生成 AI 在作画时一并绘制"
  - "禁止先生成无字原稿，再通过程序、图像编辑或本地处理补排文字"
  - "每一页必须一次性生成包含台词和气泡的完成漫画图像"
  - "台词必须严格使用 OMNY 中写明的简体中文，并以竖排方式绘制"
  - "出现乱码、错字、缺字或文字溢出气泡时，禁止后处理；只重新生成该页"
  - "不对生成的完成 PNG 做加工，直接作为交付成品"
  - "开始作画前，根据 materials 的 keywords 收集本地素材文件（立绘、背景、小物）；每格绘制时参考其 assets 中列出的素材"
  - "若找不到 assets 对应的图像素材，不得因等待素材而停止。可以根据 materials 的 note 与作品画风自由设计外观；一旦确定设计，后续格子必须保持一致"
  - "背景素材应作为该场景的美术设定资料：用来延续地点设计、色彩、光线和小物摆放；禁止复制素材图构图后把角色直接叠加。每格可按演出自由改变镜头角度、景别与构图（近景、远景、仰视、俯视、角色背后等），以该格合适的视点重新绘制背景；人物和背景必须拥有相同的光源、色温、阴影与前后遮挡关系，融合为一张画。角色脚下必须有接地阴影（bg:-1 格除外，不画接地阴影）"
  - "动作说明（表情、动作）必须与台词分离。action 是角色表情和动作的舞台指示，应独立反映在绘制中"
  - "每个气泡的形状必须遵循 shape：normal=圆形常规气泡；thought=云朵形（内心、想象）；square=方形边框（内心独白、回忆旁白）；caption=框外说明框（叙述、时间经过，放在格子角落）；flash=锯齿形（喊叫、强烈惊讶、电话或机械音）；uniflash=海胆闪光，即无数细针状线向外辐射的尖刺气泡（最高级别的尖叫或冲击；与 monologue: true 结合时也可表现无声的内心尖叫吐槽）；wobbly=抖动波浪线（虚弱、恐惧、低声）；whisper=虚线（悄声）；handwritten=无气泡的手写字。未指定 shape 的气泡使用 normal"
  - "monologue: true 的气泡表示内心独白（这是气泡级别的标记，同一格可同时有说出口的台词和内心独白）。气泡文本中不得绘制圆括号（）；内心独白的视觉表现交由 shape 决定"
  - "每格的 bg 是背景细节等级。bg:-1=不绘制背景，只铺设默认中灰色单色平涂（禁止渐变），不画风景、室内或背景侧效果（集中线、网点、漫符、光环等）；角色、气泡、格框和附着于角色的漫符（头顶汗滴、怒气标记等）照常绘制；若 action 指定底色，则覆盖默认灰色。bg:0=无具体背景；铺设匹配场景和情绪的背景色（平涂或渐变，例如愤怒=红、喜悦=暖色、惊讶=黄、紧张=紫至藏蓝、感动=金至桃、宁静=蓝），再叠加集中线、漫符、网点、光环、闪光等效果，让焦点集中于人物表情与情绪。bg:1=简易背景；在符合场景的背景色渐变上仅画 1～2 个提示地点的符号元素（墙线、窗框、桌沿、前景小物剪影等），也可用前景物体加远处色彩渐变形成纵深。bg:2=详细背景；充分刻画地点的展示格"
  - "不得在 bg:0 格中画风景、室内或小物等具体背景，只能使用情绪色平涂／渐变与效果。bg:0/1 禁止纯白背景，必须铺设与场景相符的颜色。bg:-1 格禁止中灰色单色平涂之外的一切背景表现，也不画接地阴影（阴影将在后续与背景一起添加）。必须严格遵循每格的 bg 指定"
  - "bg:0/1 的背景色应控制在低至中饱和度（偏灰、偏粉彩）。背景渐变用于传达氛围，不得比角色和台词更抢眼。高饱和鲜艳背景仅限情绪爆发或最大强调等明确演出意图的格子"
  - "bubbles 必须是数组，按从上到下的顺序阅读。一个格子可包含多个气泡。每个气泡必须放在其说话者附近（头顶、脸侧等），而格内气泡的排列应匹配说话者顺序。说话者按发言顺序从右到左排列，因此气泡自然按右上到左下阅读。没有说话者的气泡（caption、handwritten、机械音等）放在格子角落或空白区域"
  - "每个气泡的说话者由 speaker 表示。省略 speaker 时，表示与同格前一个气泡为同一说话者（旁白、拟声词没有说话者）。**气泡必须有尾巴并指向说话者**：normal、thought、flash 等普通发言气泡的尾端须朝向 speaker 角色嘴部附近，尾巴可越出气泡主体 bbox。caption、handwritten、机械音等无说话者气泡不加尾巴。除了加尾巴，还要将气泡放到说话者附近，使对应关系明确"
  - "格内人物站位应与发言顺序关联：该格第一个发言的角色（bubbles 数组的第一个说话者）位于右侧，后续说话者按发言顺序从右到左排列。气泡因靠近说话者放置，阅读顺序和人物顺序将自然一致。此规则仅适用于没有 anchor 的人物；指定了 anchor 的人物必须遵循 anchor。action 明确了构图或站位时，优先遵循 action"
  - "气泡的 emphasis 是该气泡中需要放大的词，应以同一气泡其他文字的 1.3～1.5 倍绘制"
  - "所有台词均为竖排：文字从上到下，列从右到左"
  - "正文字体使用黑体；内心独白和 caption 框内同样使用黑体"
  - "页面右装订，格子按右上至左下（id 升序）阅读"
  - "每页左上放作品标题，右上放当前页/总页数。页眉不能压住格子主体；文字为黑色，不加气泡，直接写在纸面上"
  - "若 meta.author 有作者名，则在每页下方中央以小字绘制作者名；文字为黑色，不加气泡，直接写在纸面上。若与延伸至页底的出血格重叠，作者名应叠在格子画面的最前方；必要时给文字加细白描边以保证可读性。author 为空或未指定时不画页脚"
  - "关键台词、决心宣言、气势台词和重要反应，应将说话者画成面部特写（胸部以上至脸部近景）。格子尺寸也应比前后格略大，用留白、集中线或渐变背景突出台词分量。若该格 action 有“面部特写”“胸像”“坚定的表情”等描述，应优先遵循"
  - "长台词应拆成能放入气泡的长度，分为多个气泡"
  - "可根据 action 和场景适当加入效果线和集中线"
  - "整部作品的背景色应像影像色彩脚本一样，顺着情绪起伏形成连续的色彩流动。相邻格的色相差越大，场景或情绪转换越强。照明表现（逆光=严肃、顶光=神圣、下方光=不安、光斑=感动等）可用于选择漫符和渐变"
  - "figures、bubbles 的 bbox/anchor/size 必须按 layout_spec 中的“人物与气泡边界框解释”理解。优先级为 action ＞ anchor（必须严格遵守）＞发言顺序=站位（仅无 anchor 的人物）＞size＞bbox（参考）；与 layout_spec 的优先级表完全一致"

# 版式规范（坐标、尺寸和空间；供图像生成 AI 使用）
layout_spec: |
  # 分格坐标系说明（供图像生成 AI 使用）

  ## 输出图像数量（最重要）
  - N 页原稿必须输出为 N 张独立图像
  - 禁止在一张图内拼接多页（包括跨页展开）
  - 每张图仅为一页 A4 竖版（宽 210 mm × 高 297 mm）
  - 输出 page1、page2、……时，每页必须是独立图像
  - 禁止页面间留白、并列展示、缩略图列表和跨页画面的构思

  ## 画布
  - 尺寸：A4（宽 210 mm × 高 297 mm，竖版）
  - 原点：左上角为 (0,0)。x 向右增大，y 向下增大，单位为 mm。

  ## 格子形状
  - shape.type 为 rect：用 x、y、w、h 定义矩形格（x、y 为左上坐标）
  - shape.type 为 polygon：用 points [[x1,y1],[x2,y2],...] 定义顶点坐标（多边形或对角切分）

  ## 格子间距与边线
  - 每格外圈留约 2～3 mm 的白边
  - 格框为约 1 mm 粗的黑线；相邻格子各自绘制边线，不共用
  - 例外：出血格。坐标达到 x=0 / x=210 / y=297 的边，必须延伸至纸张边缘，不留白边，不在出血边画格框。其他边照常留白和画边线。顶部因有页眉带，y 的上限为 10

  ## 背景细节（bg）
  - 每格 bg 值（-1/0/1/2）规定背景绘制量；详情参见 style_notes
  - bg:-1 格不绘制背景，只铺设默认中灰色单色平涂（禁止渐变）；不画风景、室内或背景侧效果，也不画接地阴影（是“角色脚下必须有接地阴影”规则的例外）。角色、气泡、格框和附着于角色的漫符照常绘制
  - bg:0 格没有具体背景，只用情绪色和效果。每页 bg:2 最多 2 格，位置不限。bg:-1 不计入这两个 bg:2 的限额
  - bg:-1 可自由混用（可与其他 bg 值混用，也可整页都是 bg:-1）

  ## 素材（assets）
  - 每格 assets 是该格需要参考的素材清单（materials 的 key）
  - 素材收集方式和缺失时的处理参见 style_notes

  ## 页眉坐标
  - 页眉元素位于页面最上方 y=0～10 mm 的带状区域（格子之外）
  - 左上元素（作品标题）：参考坐标 x=10、y=7，左对齐，字体约 5 mm
  - 右上元素（当前/总页数，例如 3/12）：参考坐标 x=200、y=7，右对齐，字体约 5 mm
  - 页眉不得覆盖格子主体（y=10 以后）
  - 显示内容和作画处理（字体、颜色、是否加气泡等）遵循 style_notes

  ## 页脚坐标
  - 页脚元素位于页面底部 y=287～297 mm 的带状区域
  - 中央元素（作者名 meta.author）：参考坐标 x=105、y=294，居中，字体约 4 mm
  - meta.author 为空或未指定时不画页脚
  - 即使与延伸到底部的出血格（达到 y=297）重叠，页脚仍应绘制在最前方（作画处理遵循 style_notes）

  ## 整体色调
  - 彩色漫画：线稿加平涂，必要时使用渐变

  ## 作画与演出规则
  - 阅读顺序、台词与气泡的处理（包括 shape）、独白、表情动作、背景细节、素材、高光演出和效果线等规则均参见本文件的 style_notes

  ## 人物和气泡的边界框（figures / bubbles.bbox）解释

  ### 基本原则：布局优先级（正式定义）
  布局指令按下列优先级链解释。高低规则冲突时，始终以较高优先级为准。
  此表是优先级的正式定义；其他位置的优先级说明均为与此表一致的转写。

  | 优先级 | 指定 | 作用 |
  |---|---|---|
  | 1 | action | 最高级别的演出指令（例如面部特写、从背后拍摄等明确构图） |
  | 2 | anchor | 布局命令，必须严格遵守；同时作为推断气泡尾巴方向的依据 |
  | 3 | 发言顺序=站位 | 仅适用于无 anchor 人物的站位规则（第一个说话者在右；有 anchor 时 anchor 胜出） |
  | 4 | size | 人物景别命令，优先于 bbox 尺寸 |
  | 5 | bbox | 区域与大小提示，不具约束性；用于确保面积并避免重叠，可容许数 mm 误差 |

  不得尝试按像素精确复现 bbox。bbox 表达的是
  “在格子哪个区域、约多大”；自然构图、角色姿势和透视的一致性
  优先于 bbox 的精确重现。

  ### figures（人物布局）
  - name：该格应绘制的角色名。figures 列出的角色必须全部绘制。
    不得画出 figures 中未列出的角色（action 指定为格外声音的角色只需绘制气泡，不画人物）。
  - bbox：{x, y, w, h}，画布绝对坐标（mm）；区域和大小提示，不具约束性，
    用于确保面积并避免重叠。
    - 通过纵横比判断全身或胸像，并结合 size 指定解释
    - 角色头部应落在 bbox 上方 1/3 内，以保证脸部位置可预测，气泡避让判断依赖这一前提
  - anchor：格内相对位置。可用 right / left / center / top-right / top-left /
    bottom-right / bottom-left。它是必须严格遵守的布局命令，也是推断气泡尾巴方向的依据。
    同一格多角色时，不得交换 anchor 的相对关系（谁在右、谁在左）。
  - size：景别命令。full（全身）/ waist-up（腰部以上）/
    bust-up（胸部以上）/ face（面部特写），优先于 bbox 尺寸。

  ### bubbles 的 bbox / anchor
  - bbox：气泡位置和大小的参考（mm），表示区域和大小而非强制约束，
    用于保证面积并避免重叠。可按竖排文本需要调整到自然大小，
    但必须保持气泡的相对大小排序（bbox 更大的气泡应画得更大）。
  - anchor：格内相对位置，必须严格遵守。anchor 只表示布局，不表示阅读顺序。
  - 阅读顺序唯一以 bubbles 数组顺序为准（数组顺序=右上至左下）。anchor 和 bbox
    仅表达布局。当 bbox 坐标与数组顺序看似冲突时，应优先数组顺序，修正位置以保证右上至左下的阅读顺序。

  ### 禁止事项（bbox 的额外规则）
  - 气泡不得与任何角色的脸部（头部）重叠。
    figures 的 bbox 上方 1/3 预留为脸部区域。
  - 气泡可与角色躯干或背景重叠（这是正常漫画表现）。
  - 气泡尾巴必须指向 speaker 对应角色。bbox 是不含尾巴的主体区域，
    因此尾巴可以越出 bbox。
  - polygon 格中，若 bbox 越过格子的斜边，应向内移动，确保在格内绘制（不得跨过斜边）。

  ### 回退规则
  - 未提供 figures 的格子（如 bg:0 的情绪格）可按发言顺序规则
    （发言顺序=站位，第一个说话者在右）自由决定构图。
  - 发言顺序=站位规则只适用于没有 anchor 的人物。
    有 anchor 时优先 anchor。
  - bbox 与 anchor 冲突时（例如 anchor: left 但 bbox 在格子右半边），
    遵循 anchor，bbox 仅作为大小参考。
