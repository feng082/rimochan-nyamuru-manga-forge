# ============================================================
# 《示例：看见好东西啦》
# Open Manga Name YAML（OMNY）/ Nyamuru Data Model（NDM）v10.3
# ------------------------------------------------------------
#   标题      ：示例：看见好东西啦
#   作者名    ：your-name（请修改 meta.author 后使用）
#   题材与氛围：平凡一天归途中的小小奖励
#   画风      ：标准（彩色漫画）
#   页数      ：2
# ------------------------------------------------------------
# 🧍v10.3：所有格子均应用人物居中原则
# 📐页面之间采用不同分格模式（p1=三段式 / p2=翻页承接大格）
# ============================================================

manga:
  schema_name: "Nyamuru Data Model"
  schema_version: 10.2
  meta:
    title: "示例：看见好东西啦"
    author: "your-name"
    format: "彩色漫画"
    page_count: 2
    reading_direction: "right-to-left"
    text_orientation: "vertical"
    font: "黑体"
    style_notes:
      - "雨后傍晚的光线，细致表现湿润路面的反光"
      - "便利店为虚构店铺；不得模仿真实连锁店的招牌、标志或配色"

  setting:
    location: "傍晚的住宅区，以及虚构便利店“蜂鸣便利店”"
    time: "雨后的傍晚"
    weather: "雨刚停，夕阳开始照射"
    background:
      - "便利店外观（白色墙面、黄色与橙色招牌）"
      - "住宅区人行道、水洼和湿润路面"
      - "雨后的开阔天空"
    props:
      - "塑料购物袋"
      - "杯装冰淇淋"
      - "水洼"

  characters:
    - name: "美绪"
      role: >-
        棕色波波头、穿连帽衫的女孩。放学后去了便利店。
        今天没有特别的好事或坏事，只是平常的一天

  materials:
    - key: "美绪"
      type: "character"
      keywords: ["美绪", "立绘", "便服", "室外"]
      note: "棕色波波头、短袖连帽衫、短裤；活泼，表情丰富"
    - key: "蜂鸣便利店"
      type: "background"
      keywords: ["便利店", "蜂鸣便利店", "外观", "背景"]
      note: >-
        虚构便利店。白色外观，黄色与橙色的柔和招牌。
        不使用真实连锁店的标志或配色
    - key: "雨后的天空"
      type: "background"
      keywords: ["天空", "彩虹", "傍晚", "背景"]
      note: "雨后傍晚的开阔天空，挂着一道大彩虹"

  pages:
    - page: 1
      panels:
        - id: 1
          shape: {type: "rect", x: 10, y: 10, w: 190, h: 92}
          bg: 2
          action: >-
            雨后的傍晚。美绪拎着塑料购物袋，刚从“蜂鸣便利店”门前走出来。
            湿润的路面正在发光。美绪位于格子中央
          assets: ["美绪", "蜂鸣便利店"]
          figures:
            - name: "美绪"
              bbox: {x: 70, y: 22, w: 70, h: 76}
              anchor: "center"
              size: "waist-up"
          bubbles:
            - text: "平常一天的回家路。"
              shape: "caption"
              bbox: {x: 140, y: 16, w: 54, h: 20}
            - speaker: "美绪"
              text: "我买了冰淇淋呀"
              shape: "normal"
              bbox: {x: 16, y: 24, w: 46, h: 38}
        - id: 2
          shape: {type: "rect", x: 10, y: 108, w: 190, h: 80}
          bg: 1
          action: >-
            美绪走在人行道上，同时往购物袋里看。她轻轻跨过水洼，
            脚步悠闲。美绪位于格子中央
          assets: ["美绪"]
          figures:
            - name: "美绪"
              bbox: {x: 72, y: 116, w: 66, h: 66}
              anchor: "center"
              size: "waist-up"
          bubbles:
            - speaker: "美绪"
              text: "今天做作业、洗澡，然后睡觉就好啦"
              shape: "normal"
              bbox: {x: 148, y: 114, w: 46, h: 44}
            - text: "啪嗒"
              shape: "handwritten"
              bbox: {x: 18, y: 166, w: 34, h: 14}
        - id: 3
          shape: {type: "rect", x: 10, y: 194, w: 190, h: 93}
          bg: 1
          action: >-
            美绪忽然停下脚步，抬头望向天空，露出“嗯？”的表情。
            这一格不画出她视线尽头的东西（留到下一页揭晓）。
            页面末尾的悬念格。美绪位于格子中央
          assets: ["美绪"]
          figures:
            - name: "美绪"
              bbox: {x: 72, y: 202, w: 66, h: 80}
              anchor: "center"
              size: "waist-up"
          bubbles:
            - speaker: "美绪"
              text: "……咦？"
              shape: "normal"
              bbox: {x: 16, y: 200, w: 42, h: 36}

    - page: 2
      panels:
        - id: 1
          shape: {type: "rect", x: 10, y: 10, w: 190, h: 182}
          bg: 2
          action: >-
            翻页承接的大格。雨后傍晚的天空中挂着一道大彩虹。
            画面主角是天空和彩虹；美绪以抬头仰望的姿势小小地放在左下角
          assets: ["美绪", "雨后的天空"]
          figures:
            - name: "美绪"
              bbox: {x: 20, y: 112, w: 58, h: 76}
              anchor: "bottom-left"
              size: "waist-up"
          bubbles:
            - speaker: "美绪"
              text: "是彩虹呀！"
              shape: "flash"
              bbox: {x: 144, y: 124, w: 48, h: 40}
        - id: 2
          shape: {type: "rect", x: 104, y: 198, w: 96, h: 89}
          bg: 0
          action: >-
            美绪开心的脸部特写。背景是代表感动的金色至桃色渐变，
            点缀小小的闪光。脸位于格子的正中央
          assets: ["美绪"]
          figures:
            - name: "美绪"
              bbox: {x: 118, y: 206, w: 66, h: 74}
              anchor: "center"
              size: "face"
          bubbles:
            - speaker: "美绪"
              text: "雨停了真好呀"
              shape: "thought"
              bbox: {x: 108, y: 258, w: 40, h: 24}
              monologue: true
        - id: 3
          shape: {type: "rect", x: 10, y: 198, w: 89, h: 89}
          bg: 1
          action: >-
            美绪再次迈步。身后的天空还有彩虹，脚步变得轻快了一点。
            美绪位于格子中央
          assets: ["美绪"]
          figures:
            - name: "美绪"
              bbox: {x: 22, y: 206, w: 64, h: 66}
              anchor: "center"
              size: "bust-up"
          bubbles:
            - speaker: "美绪"
              text: "看见好东西啦"
              shape: "normal"
              bbox: {x: 60, y: 202, w: 36, h: 34}
            - text: "冰淇淋稍微化了一点儿。"
              shape: "caption"
              bbox: {x: 14, y: 262, w: 60, h: 20}
